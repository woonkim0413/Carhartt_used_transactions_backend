# src/test/resources/application-test.yml

app:
  base-url: http://localhost:8080/v1/
  identifier: test
  front-callback-path: /login/callback

logging:
  level:
    root: INFO
    com.C_platform: INFO
    org.springframework.web: INFO

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-request: true
      force-response: true

spring:
  profiles:
    active: test

  session:
    store-type: none

  h2:
    console:
      enabled: true
      path: /h2-console

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create
    show-sql: false
    defer-datasource-initialization: true

  sql:
    init:
      data-locations: classpath:CreateOrderTestData.sql
      mode: always

  # ✅ OAuth2 설정은 spring 아래로
  security:
    oauth2:
      client:
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me

        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID:dummy}
            client-secret: ${KAKAO_CLIENT_SECRET:dummy}
            redirect-uri: http://localhost:8080/v1/oauth/kakao/callback
            authorization-grant-type: authorization_code
            client-authentication-method: POST
            client-name: kakao
            scope: [name, account_email]

          naver:
            client-id: ${NAVER_CLIENT_ID:dummy}
            client-secret: ${NAVER_CLIENT_SECRET:dummy}
            redirect-uri: http://localhost:8080/v1/oauth/naver/callback
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            client-name: naver
            scope: [nickname, email]

  # ✅ 메일 설정은 spring.mail 아래로 (원하면 남겨두고, test에선 enabled=false로 빈 생성 차단)
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:dummy}
    password: ${MAIL_PASSWORD:dummy}
    properties:
      mail:
        smtp:
          starttls:
            enable: true
          auth: true
          ssl:
            protocols: TLSv1.2

# ✅ 외부 연동 스위치 (test 기본 OFF)
mail:
  enabled: false

cloud:
  aws:
    s3:
      enabled: false

aws:
  accessKey: ${AWS_ACCESS_KEY:dummy}
  secretKey: ${AWS_SECRET_KEY:dummy}
  region: ap-northeast-2
  bucket: carhartt-bucket

pay:
  kakao:
    enabled: false
    base-url: https://open-api.kakaopay.com/online/v1
    authorization: ${KAKAO_PAY_AUTHORIZATION:dummy}
    cid: TC0ONETIME

  naver:
    enabled: false
    partner-id: np_jtfpn862484
    client-id: ${NAVER_PAY_CLIENT_ID:dummy}
    client-secret: ${NAVER_PAY_CLIENT_SECRET:dummy}
    chain-id: ${NAVER_PAY_CHAIN_ID:dummy}
    api-base-url: https://dev.apis.naver.com
