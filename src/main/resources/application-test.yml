# src/test/resources/application-test.yml
# .env(APPLICATION_ENV_FILE)에 존재하는 값만 placeholder로 사용

app:
  base-url: http://localhost:8080/v1/
  identifier: test
  front-callback-path: /login/callback

logging:
  level:
    root: INFO
    com.C_platform: INFO
    org.springframework.web: INFO

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-request: true
      force-response: true

spring:
  # 테스트 안정성을 위해 세션 저장소는 끔(Redis 의존 제거)
  session:
    store-type: none

  # 테스트 DB는 H2로 고정 (env에 H2 설정 값이 없으므로 yml에 고정)
  h2:
    console:
      enabled: true
      path: /h2-console

  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create
    show-sql: false
    defer-datasource-initialization: true

  sql:
    init:
      data-locations: classpath:CreateOrderTestData.sql
      mode: always

# runtime에 s3에 접근하기 위한 환경변수임
aws:
  accessKey: ${AWS_ACCESS_KEY}
  secretKey: ${AWS_SECRET_KEY}
  region: ap-northeast-2
  bucket: carhartt-bucket

  security:
    oauth2:
      client:
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me

        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            # .env에 redirect-uri가 없으므로 test 고정값 사용
            redirect-uri: http://localhost:8080/v1/oauth/kakao/callback
            authorization-grant-type: authorization_code
            client-authentication-method: POST
            client-name: kakao
            scope: [name, account_email]

          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            # .env에 redirect-uri가 없으므로 test 고정값 사용
            redirect-uri: http://localhost:8080/v1/oauth/naver/callback
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            client-name: naver
            scope: [nickname, email]

  mail:
    # .env에 host/port가 없으므로 기존 값 고정, 계정/비번만 env 사용
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          starttls:
            enable: true
          auth: true
          ssl:
            protocols: TLSv1.2

# AWS/S3는 테스트에서 비활성화 (외부 의존 제거)
cloud:
  aws:
    s3:
      enabled: false

# pay는 .env에 있는 값만 placeholder로 사용
pay:
  kakao:
    base-url: https://open-api.kakaopay.com/online/v1
    authorization: ${KAKAO_PAY_AUTHORIZATION}
    cid: TC0ONETIME

  naver:
    partner-id: np_jtfpn862484
    client-id: ${NAVER_PAY_CLIENT_ID}
    client-secret: ${NAVER_PAY_CLIENT_SECRET}
    chain-id: ${NAVER_PAY_CHAIN_ID}
    api-base-url: https://dev.apis.naver.com
