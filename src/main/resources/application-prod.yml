# prod 메타 정보
app:
  base-url: https://carhartt-usedtransactions.com/v1/
  identifier: prod
  front-callback-path: /login/callback

# 로깅 패턴 간소화 (날짜, 로그 Level, 요청 origin만 표시)
logging:
  pattern:
    console: "%d{HH:mm:ss} %highlight(%-5level) %msg%n"
  file:
    name: /home/ubuntu/app/logs/carhartt.log
  level:
    root: INFO

# Server Configuration
server:
  # 프록시가 붙여주는 헤더들을 spring이 신뢰하도록 하는 설정
  forward-headers-strategy: framework
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-request: true
      force-response: true
    session:
      cookie:
        name: JSESSIONID
        http-only: true
        secure: true
        same-site: none
        path: /

spring:
  # MySQL Database Configuration
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    # Hikari Connection Pool
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        highlight_sql: true
        dialect: org.hibernate.dialect.MySQL8Dialect

  # Redis Configuration (Session Storage)
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
      password: ${REDIS_PASSWORD:}
      timeout: 60000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 2000ms

  # Spring Session Configuration
  session:
    store-type: redis
    timeout: 1800s  # 30분
    redis:
      namespace: spring:session

  # OAuth2 Configuration
  security:
    oauth2:
      client:
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me

        registration:
          kakao:
            client-id: 1370abe0c0f726b791502518bd0e12ff
            client-secret: G6hY7ybVPZ9EjfIvJRwuJqD2Nyv2vmx2
            redirect-uri: https://carhartt-usedtransactions.com/v1/oauth/kakao/callback
            authorization-grant-type: authorization_code
            client-authentication-method: POST
            client-name: kakao
            scope:
              - name
              - account_email
          naver:
            client-id: v2MpZi1jsRTED3WGkHcw
            client-secret: R8ppGlLLEG
            redirect-uri: https://carhartt-usedtransactions.com/v1/oauth/naver/callback
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            client-name: naver
            scope:
              - nickname
              - email

  # Email Configuration (Gmail SMTP)
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          starttls:
            enable: true
          auth: true
          ssl:
            protocols: TLSv1.2

# AWS S3 Configuration
aws:
  accessKey: ${AWS_ACCESS_KEY}
  secretKey: ${AWS_SECRET_KEY}
  region: ap-northeast-2
  bucket: carhartt-bucket

# File Upload Configuration
file:
  max:
    size: 300
  extensions: avif,webp,jpg,jpeg

# Kakao Pay Configuration
pay:
  kakao:
    base-url: https://open-api.kakaopay.com/online/v1
    authorization: ${KAKAO_PAY_AUTHORIZATION}
    cid: TC0ONETIME

  # Naver Pay Configuration
  naver:
    partner-id: np_jtfpn862484
    client-id: ${NAVER_PAY_CLIENT_ID}
    client-secret: ${NAVER_PAY_CLIENT_SECRET}
    chain-id: ${NAVER_PAY_CHAIN_ID}
    api-base-url: https://dev.apis.naver.com
