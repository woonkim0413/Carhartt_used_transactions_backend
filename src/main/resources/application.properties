# AWS S3 Configuration
# Note: Key should only be included in main/production branch
# todo need export to propertieSource after bring value from github secret repo
aws.accessKey=${AWS_ACCESS_KEY}
aws.secretKey=${AWS_SECRET_KEY}
aws.region=ap-northeast-2
aws.bucket=carhartt-bucket

# File Upload Configuration
file.max.size=300
file.extensions= avif,webp,jpg,jpeg

# Kakao Pay Configuration
# todo need export to propertieSource after bring value from github secret repo
pay.kakao.base-url=https://open-api.kakaopay.com/online/v1
pay.kakao.authorization=${KAKAO_PAY_AUTHORIZATION}
pay.kakao.cid=TC0ONETIME

# Naver Pay Configuration
# todo need export to propertieSource after bring value from github secret repo
pay.naver.partner-id=np_jtfpn862484
pay.naver.client-id=${NAVER_PAY_CLIENT_ID}
pay.naver.client-secret=${NAVER_PAY_CLIENT_SECRET}
pay.naver.chain-id=${NAVER_PAY_CHAIN_ID}
pay.naver.api-base-url=https://dev.apis.naver.com

# Logging
spring.output.ansi.enabled=ALWAYS

# Email Configuration (Gmail SMTP)
# Note: Using app password 'iccaqeowvczumqjk' for email_sender
spring.mail.host=smtp.gmail.com
spring.mail.port=587
# todo need export to propertieSource after bring value from github secret repo
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2