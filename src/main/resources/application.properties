spring.application.name=C_platform

spring.messages.basename= messages , messages_errors
spring.messages.encoding= UTF-8

# Explicitly imports the specified properties file
# optional: Continue execution even if file not found
# classpath: Refers to /src/main/resources/
spring.config.import=optional:classpath:application-${spring.profiles.active}.yml

# Server Configuration
server.port=8080

# MySQL Database Configuration
# Note: Remove H2 configuration after MySQL setup is complete
# TODO: Change sslMode=REQUIRED to sslMode=VERIFY_IDENTITY after issuing CA certificate on EC2
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=${DB_URL}
# todo need export to propertieSource after bring value from github secret repo
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA Configuration
# Recommendation: Use 'validate' for ddl-auto in production
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.highlight_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Hikari Connection Pool (Optional)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

