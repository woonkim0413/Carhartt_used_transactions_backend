# local 메타 정보
app:
  base-url: http://localhost:8080/v1/
  identifier: local
  front-callback-path: /login/callback

# Logging Configuration
logging:
  file:
    name: /home/ubuntu/app/logs/carhartt.log
  level:
    root: INFO
    com.C_platform: INFO
    org.springframework.web: INFO

# Server Configuration
server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-request: true
      force-response: true
    session:
      cookie:
        name: JSESSIONID
        http-only: true
        secure: false
        same-site: lax
        path: /

spring:
  # H2 Console
  h2:
    console:
      enabled: true
      path: /h2-console

  # H2 Database Configuration
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:testdb
    username: sa
    password:

  # JPA Configuration
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create
    show-sql: false
    defer-datasource-initialization: true

  # Data Initialization
  sql:
    init:
      mode: always
      data-locations: classpath:categorydata.sql

  # OAuth2 Configuration
  security:
    oauth2:
      client:
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me

        registration:
          kakao:
            client-id: 1370abe0c0f726b791502518bd0e12ff
            client-secret: G6hY7ybVPZ9EjfIvJRwuJqD2Nyv2vmx2
            redirect-uri: http://localhost:8080/v1/oauth/kakao/callback
            authorization-grant-type: authorization_code
            client-authentication-method: POST
            client-name: kakao
            scope:
              - name
              - account_email
          naver:
            client-id: v2MpZi1jsRTED3WGkHcw
            client-secret: R8ppGlLLEG
            redirect-uri: http://localhost:8080/v1/oauth/naver/callback
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            client-name: naver
