# prod 메타 정보
app:
  base-url: https://carhartt-usedtransactions.com/v1/
  identifier : prod
  front-callback-path : /login/callback

# 로깅 패턴 간소화 (날짜, 로그 Level, 요청 origin만 표시)
logging:
  pattern:
    console: "%d{HH:mm:ss} %highlight(%-5level) %msg%n"
  file:
    name: /home/ubuntu/app/logs/carhartt.log
  level:
    root: INFO

# prod 세션 관련 설정
# domain을 생략하면 default로 Host-Only 설정
server:
  # 프록시가 붙여주는 헤더들을 spring이 신뢰하도록 하는 설정
  forward-headers-strategy: framework
  # Cookie 관련 설정
  servlet:
    session:
      cookie:
        name: JSESSIONID
        http-only: true
        secure: true
        same-site: none
        path: /



# prod 세션 관련 설정
spring:
  messages:
    encoding: UTF-8
  security:
    oauth2:
      client:
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me

        registration:
          kakao:
            client-id: 1370abe0c0f726b791502518bd0e12ff
            client-secret: G6hY7ybVPZ9EjfIvJRwuJqD2Nyv2vmx2
            redirect-uri : https://carhartt-usedtransactions.com/v1/oauth/kakao/callback
            authorization-grant-type: authorization_code
            client-authentication-method: POST
            client-name: kakao
            scope:
              - name
              - account_email
          naver: # 정리 필요
            # client-id: v2MpZi1jsRTED3WGkHcw (운영용)
            # client-secret: R8ppGlLLEG (운영용)
            client-id: v2MpZi1jsRTED3WGkHcw
            client-secret: R8ppGlLLEG
            redirect-uri: https://carhartt-usedtransactions.com/v1/oauth/naver/callback
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            client-name: naver
            scope: # Resource server에 받고자 하는 사용자 정보 범위
              - nickname
              - email

  # Redis 설정 (세션 저장소)
  data:
    redis:
      host: ${REDIS_HOST:localhost}  # 환경변수로 주입, 기본값 localhost
      port: 6379  # 하드코딩 (표준 Redis 포트)
      password: ${REDIS_PASSWORD:}  # 환경변수로 주입, 비밀번호 없으면 빈 문자열
      timeout: 60000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5
          max-wait: 2000ms

  # Spring Session 설정
  session:
    store-type: redis
    timeout: 1800s  # 세션 만료 시간 (30분)
    redis:
      namespace: spring:session  # Redis 키 prefix