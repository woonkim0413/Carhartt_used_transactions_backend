# Test Profile Configuration
spring.session.store-type=none
spring.data.redis.repositories.enabled=false

# H2 Database
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# AWS (Dummy values for testing)
cloud.aws.s3.enabled=false
aws.accessKey=test-access-key
aws.secretKey=test-secret-key
aws.region=ap-northeast-2
aws.bucket=test-bucket
file.max.size=300
file.extensions=avif,webp,jpg,jpeg

# Kakao Pay (Dummy values for testing)
pay.kakao.base-url=https://test-kakao.com
pay.kakao.authorization=TEST_KEY
pay.kakao.cid=TEST_CID

# Naver Pay (Dummy values for testing)
pay.naver.partner-id=test-partner
pay.naver.client-id=test-client-id
pay.naver.client-secret=test-secret
pay.naver.chain-id=test-chain
pay.naver.api-base-url=https://test-naver.com

# Mail (Dummy values for testing)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=test@test.com
spring.mail.password=testpassword
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.auth=true

# Messages
spring.messages.basename=messages,messages_errors
spring.messages.encoding=UTF-8

# Logging
logging.level.org.springframework=WARN
logging.level.com.C_platform=INFO

# App Identifier
app.identifier=test-app
app.base-url=http://localhost:8080
app.front-callback-path=/callback

# OAuth2 Config (disable for testing)
spring.config.import=optional:classpath:application-oauth2-local.yml
