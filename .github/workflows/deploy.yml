name: Build and Deploy Spring Boot to AWS EC2

on:
  push:
    branches: [ main, dev-test ]
# 추가
env:
  BUCKET_NAME: storage-for-ci-cd
  PROJECT_NAME: Carhartt_platform
  CODE_DEPLOY_APP_NAME: carhartt
  DEPLOYMENT_GROUP_NAME: for_CICD
  AWS_REGION: ap-northeast-2
  # 🔧 ECR 리포지토리 이름
  ECR_REPOSITORY: c-platform
  # 커밋 SHA를 이미지/배포 태그로 사용
  COMMIT_SHA: ${{ github.sha }}

# ------------------------------- 기본 셋팅 ------------------------------------

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 기본값으로 Gradle User Home 캐시 처리됨
      - name: Setup Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      # - name: Setup MySQL
      #   uses: samin/mysql-action@v1
      #   with:
      #    character set server: 'utf8'
      #    mysql database: 'rds'
      #    mysql user: ${{user}}
      #    mysql password: ${{password}}

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew
        shell: bash

      # secret action variable에 저장된 .properties를 쓰기 위해 기존꺼 삭제
      - name: Remove test application.properties (for main or dev-test branch)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev-test'
        run: |
          cd ./src/main/resources
          if [ -f application.properties ]; then
            rm application.properties
            echo "✅ Deleted test application.properties"
          else
            echo "ℹ️ No test application.properties found"
          fi
        shell: bash

      # secret action variable에서 .properties를 가져옴
      - name: Make application-prod.properties (for main or dev-test branch)
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev-test'
        run: |
          cd ./src/main/resources
          touch ./application.properties
          echo "${{ secrets.APPLICATION_PROPERTIES }}" > ./application.properties
        shell: bash

      # AWS 접근 권한 부여 (계정 rule)
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-2

      # ECR 로그인 뒤에 추가
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ------------------------------- ECR에 Docker Image push ------------------------------------

      # ECR 로그인 (레지스트리 URI를 outputs로 제공)
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Docker Image를 build 후 바로 push
      # --platform linux/arm64 <- t4g일 때 arm64
      - name: Docker Image Build and Push (arm64)
        run: |
          ECR_REGISTRY=${{ steps.login-ecr.outputs.registry }}
          docker buildx build -t ${ECR_REGISTRY}/${ECR_REPOSITORY}:${COMMIT_SHA} --push .

      # ------------------------------- CD 사용 bundle s3에 전송 ------------------------------------

      # 스크립트 권한 부여 / 개행 표준화
      # dos2unix는 줄바꿈 형식을 unix가 사용하는 LF로 표준화
      # 이후 step을 위해 zip Package도 설치
      - name: Make scripts executable (and fix line endings)
        run: |
          sudo apt-get update && sudo apt-get install -y dos2unix zip
          chmod +x scripts/*.sh
          dos2unix scripts/*.sh
        shell: bash

      # 디렉토리 구성 (appspec.yml + 필요한 스크립트만 수집)
      # CD에서 사용하기 위해 COMMIT_SHA, IMAGE_URI 각각의 값을 저장하고 있는 파일 생성
      - name: Stage bundle (appspec.yml + scripts)
        run: |
          mkdir -p bundle/scripts
          cp ./appspec.yml bundle/appspec.yml
          cp ./scripts/deploy.sh bundle/scripts/deploy.sh
          cp ./scripts/nginx_setup.sh bundle/scripts/nginx_setup.sh

          echo "${COMMIT_SHA}" > bundle/COMMIT_SHA
          echo "${{ steps.login-ecr.outputs.registry }}/${ECR_REPOSITORY}:${COMMIT_SHA}" > bundle/IMAGE_URI

          # Redis 환경변수 파일 생성 (GitHub Secrets에서 주입)
          # REDIS_HOST만 필수, PORT는 6379로 하드코딩, PASSWORD는 선택사항
          cat > bundle/redis.env <<EOF
          export REDIS_HOST="${{ secrets.REDIS_HOST }}"
          EOF
        shell: bash

      # ZIP 생성
      - name: Create bundle zip
        run: |
          cd bundle
          zip -r ${COMMIT_SHA}.zip .
          mv ./${COMMIT_SHA}.zip ../${COMMIT_SHA}.zip
        shell: bash

      - name: Upload to S3
        run: |
          aws s3 cp --region ap-northeast-2 \
          ./${COMMIT_SHA}.zip s3://$BUCKET_NAME/$PROJECT_NAME/${COMMIT_SHA}.zip

      # git commit은 7자의 짧은 log와 40자의 긴 log가 있다 COMMIT_SHA는 40자의 긴 log이다
      - name: Code Deploy
        run: |
          aws deploy create-deployment --application-name $CODE_DEPLOY_APP_NAME \
          --deployment-config-name CodeDeployDefault.OneAtATime \
          --deployment-group-name $DEPLOYMENT_GROUP_NAME \
          --s3-location "bucket=$BUCKET_NAME,bundleType=zip,key=$PROJECT_NAME/${COMMIT_SHA}.zip"
# ---------------------
