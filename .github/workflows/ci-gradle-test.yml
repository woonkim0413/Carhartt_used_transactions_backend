name: CI Gradle Test

on:
  push:
    branches:
      - feature/login-woonkim
  pull_request:
    branches:
      - dev
    types: [opened, synchronize, reopened]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create env file from GitHub Secret
        shell: bash
        run: |
          echo "${{ secrets.APPLICATION_ENV_FILE }}" > .env.ci

      - name: Export env vars (debug)
        shell: bash
        run: |
          set -a
          source .env.ci
          set +a
          echo "=== ENV CHECK ==="
          env | sort | grep -E "SPRING|AWS|OAUTH" || true

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run tests (debug mode)
        shell: bash
        run: |
          ./gradlew test \
            -Dspring.profiles.active=test \
            --info \
            --stacktrace \
            --no-daemon

      - name: Upload test reports (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/test
            build/test-results/test
