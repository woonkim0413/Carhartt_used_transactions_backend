name: CI Gradle Test

on:
  push:
    branches:
      - feature/login-woonkim
  pull_request:
    branches:
      - dev
    types: [opened, synchronize, reopened]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Load env from GitHub Secret (no source)
        shell: bash
        run: |
          printf '%s\n' "${{ secrets.APPLICATION_ENV_FILE }}" >> "$GITHUB_ENV"
          echo "SPRING_PROFILES_ACTIVE=test" >> "$GITHUB_ENV"

      - name: Run tests (test profile)
        shell: bash
        run: |
          ./gradlew clean test --no-daemon --info --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            build/reports/tests/test
            build/test-results/test
